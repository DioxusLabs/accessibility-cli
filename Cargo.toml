[workspace]
resolver = "2"
members = [
    "packages/accessibility-android-sys",
    "packages/accessibility-linux-sys",
    "packages/accessibility-macos-sys",
    "packages/accessibility-windows-sys",
    "packages/accessibility-ios-sys",
    "packages/accessibility-core",
    "packages/accessibility-serve",
    "packages/accessibility-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/accessibility-cli"
homepage = "https://github.com/DioxusLabs/accessibility-cli"

[workspace.dependencies]
accessibility-core = { path = "packages/accessibility-core", version = "0.1.0" }
accessibility-serve = { path = "packages/accessibility-serve", version = "0.1.0" }
accessibility-cli = { path = "packages/accessibility-cli", version = "0.1.0" }
accessibility-android-sys = { path = "packages/accessibility-android-sys", version = "0.1.0" }
accessibility-linux-sys = { path = "packages/accessibility-linux-sys", version = "0.1.0" }
accessibility-macos-sys = { path = "packages/accessibility-macos-sys", version = "0.1.0" }
accessibility-windows-sys = { path = "packages/accessibility-windows-sys", version = "0.1.0" }
accessibility-ios-sys = { path = "packages/accessibility-ios-sys", version = "0.1.0" }
ab_glyph = "0.2"
accesskit = { version = "0.22", features = ["enumn", "schemars", "serde"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
atspi = { version = "0.29", features = ["connection", "proxies"] }
axum = "0.8"
atspi-common = "0.13"
block2 = "0.6"
bytes = "1"
clap = { version = "4", features = ["derive"] }
cssparser = "0.31"
dispatch2 = "0.3"
ctrlc = "3"
euclid = { version = "0.22", features = ["serde"] }
futures-lite = "2"
futures-util = "0.3"
image = "0.25"
imageproc = "0.25"
keyboard-types = "0.7"
libc = "0.2"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFCGTypes"] }
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMTime",
    "CMFormatDescription",
    "CMBlockBuffer",
    "objc2-core-video",
] }
objc2-core-video = { version = "0.3", features = [
    "CVPixelBuffer",
    "CVPixelBufferPool",
    "CVImageBuffer",
    "CVBuffer",
    "CVReturn",
    "objc2-io-surface",
] }
objc2-foundation = "0.3"
objc2-io-surface = { version = "0.3", features = ["IOSurfaceRef"] }
objc2-video-toolbox = { version = "0.3", features = [
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTSession",
    "VTErrors",
    "block2",
    "objc2-core-media",
    "objc2-core-video",
] }
quick-xml = "0.37"
selectors = "0.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serial_test = { version = "3", features = ["file_locks"] }
slotmap = { version = "1.1", features = ["serde"] }
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.49.0", features = ["full"] }
viuer = "0.9"
webrtc = "0.14"
x11rb = { version = "0.13", features = ["randr"] }
zbus = { version = "5", features = ["tokio"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
