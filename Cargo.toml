[workspace]
resolver = "2"
members = [
    "packages/accessibility-core",
    "packages/accessibility-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ealmloff/accessibility-cli"

[workspace.dependencies]
accessibility-core = { path = "packages/accessibility-core" }
accessibility-cli = { path = "packages/accessibility-cli" }
ab_glyph = "0.2"
accesskit = { version = "0.22", features = ["enumn", "schemars", "serde"] }
anyhow = "1.0.100"
async-trait = "0.1.89"
atspi = { version = "0.29", features = ["connection", "proxies"] }
atspi-common = "0.13"
clap = { version = "4", features = ["derive"] }
cssparser = "0.31"
ctrlc = "3"
euclid = { version = "0.22", features = ["serde"] }
futures-lite = "2"
image = "0.25"
imageproc = "0.25"
keyboard-types = "0.7"
quick-xml = "0.37"
selectors = "0.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serial_test = "3"
slotmap = { version = "1.1", features = ["serde"] }
tokio = { version = "1.49.0", features = ["full"] }
viuer = "0.9"
x11rb = { version = "0.13", features = ["randr"] }
zbus = { version = "5", features = ["tokio"] }
