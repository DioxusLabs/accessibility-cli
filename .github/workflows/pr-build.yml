name: pr-build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libatspi2.0-dev libx11-xcb-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins
      - run: cargo test -p accessibility-cli --test cli_smoke

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: accessibility-cli-x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact_name: accessibility-cli-x86_64-pc-windows-msvc.exe
          - os: macos-15
            target: aarch64-apple-darwin
            artifact_name: accessibility-cli-aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: accessibility-cli-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libatspi2.0-dev libx11-xcb-dev
      - run: cargo build --release --target ${{ matrix.target }} -p accessibility-cli --bin accessibility-cli
      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/accessibility-cli dist/${{ matrix.artifact_name }}
      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/accessibility-cli.exe dist/${{ matrix.artifact_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish-pr-release:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Move rolling PR tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: pr-${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null 2>&1; then
            exit 0
          fi

          gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
      - name: Publish rolling PR release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.pull_request.number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }})"
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Install this PR build with:

            ```bash
            export GITHUB_TOKEN=ghp_xxx
            cargo binstall \
              --git https://github.com/${{ github.repository }} \
              --pkg-url "https://github.com/${{ github.repository }}/releases/download/pr-${{ github.event.pull_request.number }}/accessibility-cli-{ target }{ archive-suffix }" \
              --pkg-fmt bin \
              --strategies crate-meta-data \
              --no-confirm \
              --force \
              accessibility-cli
            ```

  publish-main-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish main commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: "main ${{ github.sha }}"
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Install this main commit build with:

            ```bash
            export GITHUB_TOKEN=ghp_xxx
            cargo binstall \
              --git https://github.com/${{ github.repository }} \
              --pkg-url "https://github.com/${{ github.repository }}/releases/download/main-${{ github.sha }}/accessibility-cli-{ target }{ archive-suffix }" \
              --pkg-fmt bin \
              --strategies crate-meta-data \
              --no-confirm \
              --force \
              accessibility-cli
            ```

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            test: gnome_calculator_e2e
          - os: windows-2025
            test: calculator_windows_e2e
          - os: macos-15
            test: calculator_e2e
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux E2E dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libatspi2.0-dev \
            libx11-xcb-dev \
            xvfb \
            at-spi2-core \
            gnome-calculator \
            dbus-x11 \
            libgtk-3-0
      - name: Run Linux E2E
        if: runner.os == 'Linux'
        run: |
          eval $(dbus-launch --sh-syntax)
          export DBUS_SESSION_BUS_ADDRESS
          export GTK_MODULES=gail:atk-bridge
          export NO_AT_BRIDGE=0
          /usr/libexec/at-spi2-registryd &
          sleep 1
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            cargo test -p accessibility-core --test ${{ matrix.test }} -- --nocapture --test-threads=1
      - name: Run Desktop E2E
        if: runner.os != 'Linux'
        run: cargo test -p accessibility-core --test ${{ matrix.test }} -- --nocapture --test-threads=1
