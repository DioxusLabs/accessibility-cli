name: pr-build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libatspi2.0-dev libx11-xcb-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins
      - run: cargo test -p accessibility-cli --test cli_smoke

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }} -p accessibility-cli --bin accessibility-cli
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/accessibility-cli" \
             "dist/accessibility-cli-${{ matrix.target }}"
      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/accessibility-cli.exe" \
             "dist/accessibility-cli-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/accessibility-cli-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  # Tagged releases (e.g. `v0.1.0`) are built and published by
  # `.github/workflows/release.yml`, generated by `dist`. The `build` job
  # above keeps producing artifacts for every PR/main push so the contributor
  # `scripts/install-from-ci.sh` helper continues to work between releases.

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            test: gnome_calculator_e2e
          - os: windows-11-arm
            test: calculator_windows_e2e
          - os: macos-15
            test: calculator_e2e
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux E2E dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libatspi2.0-dev \
            libx11-xcb-dev \
            xvfb \
            at-spi2-core \
            gnome-calculator \
            dbus-x11 \
            libgtk-3-0
      - name: Setup Windows Calculator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $calc = Get-AppxPackage -Name Microsoft.WindowsCalculator -ErrorAction SilentlyContinue
          if ($calc) {
            Write-Host "Windows Calculator is already installed: $($calc.Version)"
            exit 0
          }

          Write-Host "Windows Calculator not found, installing via winget..."

          winget install 9WZDNCRFHVN5 -s msstore --disable-interactivity --accept-source-agreements --accept-package-agreements

          $calc = Get-AppxPackage -Name Microsoft.WindowsCalculator -ErrorAction SilentlyContinue
          if ($calc) {
            Write-Host "Windows Calculator installed successfully: $($calc.Version)"
          } else {
            Write-Error "Failed to install Windows Calculator"
            exit 1
          }
      - name: Run Linux E2E
        if: runner.os == 'Linux'
        run: |
          eval $(dbus-launch --sh-syntax)
          export DBUS_SESSION_BUS_ADDRESS
          export GTK_MODULES=gail:atk-bridge
          export NO_AT_BRIDGE=0
          /usr/libexec/at-spi2-registryd &
          sleep 1
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            cargo test -p accessibility-core --test ${{ matrix.test }} -- --nocapture --test-threads=1
      - name: Run Desktop E2E
        if: runner.os != 'Linux'
        run: cargo test -p accessibility-core --test ${{ matrix.test }} -- --nocapture --test-threads=1
