name: pr-build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libatspi2.0-dev libx11-xcb-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --lib --bins
      - run: cargo test -p accessibility-cli --test cli_smoke

  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl-tools
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }} -p accessibility-cli --bin accessibility-cli
      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/accessibility-cli" \
             "dist/accessibility-cli-${{ matrix.target }}"
      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/accessibility-cli.exe" \
             "dist/accessibility-cli-${{ matrix.target }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/accessibility-cli-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 7

  publish-main-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Set release vars
        id: vars
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::12}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "commit_tag=main-$short_sha" >> "$GITHUB_OUTPUT"
      - name: Publish immutable main commit release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.commit_tag }}
          target_commitish: ${{ github.sha }}
          name: "main ${{ steps.vars.outputs.short_sha }}"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            accessibility-cli built from main commit ${{ github.sha }}.
      - name: Move rolling main tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: main
          SHA: ${{ github.sha }}
        run: |
          if gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null 2>&1; then
            exit 0
          fi
          gh api --method POST "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
      - name: Publish rolling main release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main
          target_commitish: ${{ github.sha }}
          name: "main (rolling)"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            accessibility-cli — latest build from main.

  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            test: gnome_calculator_e2e
          - os: windows-11-arm
            test: calculator_windows_e2e
          - os: macos-15
            test: calculator_e2e
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux E2E dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libatspi2.0-dev \
            libx11-xcb-dev \
            xvfb \
            at-spi2-core \
            gnome-calculator \
            dbus-x11 \
            libgtk-3-0
      - name: Setup Windows Calculator
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $calc = Get-AppxPackage -Name Microsoft.WindowsCalculator -ErrorAction SilentlyContinue
          if ($calc) {
            Write-Host "Windows Calculator is already installed: $($calc.Version)"
            exit 0
          }

          Write-Host "Windows Calculator not found, installing via winget..."

          winget install 9WZDNCRFHVN5 -s msstore --disable-interactivity --accept-source-agreements --accept-package-agreements

          $calc = Get-AppxPackage -Name Microsoft.WindowsCalculator -ErrorAction SilentlyContinue
          if ($calc) {
            Write-Host "Windows Calculator installed successfully: $($calc.Version)"
          } else {
            Write-Error "Failed to install Windows Calculator"
            exit 1
          }
      - name: Dismiss Windows blocker popups
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The windows-11-arm runner image often boots with a "Microsoft
          # account" sign-in popup floating above the desktop (from OOBE / Store
          # flows). It z-orders above Calculator and steals synthetic clicks at
          # the calculator's coordinates, which breaks `mouse_click_at` tests
          # while leaving UI Automation tests unaffected. Enumerate top-level
          # visible windows and kill the host process for any whose title
          # matches a known blocker.
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public class WD {
              public delegate bool EnumProc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
              [DllImport("user32.dll", CharSet=CharSet.Unicode)]
              public static extern int GetWindowTextW(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
          }
          '@
          $blockers = @('Microsoft account')
          $hits = New-Object System.Collections.ArrayList
          $proc = [WD+EnumProc]{
              param($h, $l)
              if (-not [WD]::IsWindowVisible($h)) { return $true }
              $sb = New-Object System.Text.StringBuilder 512
              [void][WD]::GetWindowTextW($h, $sb, 512)
              $title = $sb.ToString()
              if ($blockers -contains $title) {
                  $pid = 0
                  [void][WD]::GetWindowThreadProcessId($h, [ref]$pid)
                  [void]$hits.Add([pscustomobject]@{Title=$title; Pid=$pid})
              }
              return $true
          }
          [void][WD]::EnumWindows($proc, [IntPtr]::Zero)
          foreach ($hit in $hits) {
              Write-Host "Killing blocker '$($hit.Title)' (PID $($hit.Pid))"
              Stop-Process -Id $hit.Pid -Force -ErrorAction SilentlyContinue
          }
          if ($hits.Count -eq 0) { Write-Host "No blocker popups found" }
      - name: Run Linux E2E
        if: runner.os == 'Linux'
        run: |
          eval $(dbus-launch --sh-syntax)
          export DBUS_SESSION_BUS_ADDRESS
          export GTK_MODULES=gail:atk-bridge
          export NO_AT_BRIDGE=0
          /usr/libexec/at-spi2-registryd &
          sleep 1
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            cargo test -p accessibility-core --test ${{ matrix.test }} -- --nocapture --test-threads=1
      - name: Run Desktop E2E
        if: runner.os != 'Linux'
        run: cargo test -p accessibility-core --test ${{ matrix.test }} -- --nocapture --test-threads=1
