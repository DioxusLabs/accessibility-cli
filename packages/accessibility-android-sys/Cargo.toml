[package]
name = "accessibility-android-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Low-level ADB wrappers used by accessibility-cli's Android backend."
readme = "../../README.md"
keywords = ["accessibility", "android", "adb", "automation"]
categories = ["accessibility", "api-bindings", "os"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
keyboard-types.workspace = true
memmap2 = "0.9"
prost = "0.13"
tokio.workspace = true
tonic = { version = "0.13", default-features = false, features = ["channel", "codegen", "prost"] }

[dev-dependencies]
rtp = "0.14"
serde_json.workspace = true
webrtc.workspace = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = { version = "0.13", default-features = false, features = ["prost"] }
