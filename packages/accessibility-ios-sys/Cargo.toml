[package]
name = "accessibility-ios-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Safe low-level wrappers around iOS Simulator private accessibility and HID APIs used by accessibility-cli."
readme = "../../README.md"
keywords = ["accessibility", "ios", "simulator", "automation"]
categories = ["accessibility", "api-bindings", "os::macos-apis"]

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
bytes.workspace = true
euclid.workspace = true
image.workspace = true
slotmap.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-av-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-io-surface.workspace = true
objc2-video-toolbox.workspace = true

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
