# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/.
#
# This config is intentionally conservative: it accepts the OSI-approved
# licenses we're comfortable redistributing, fails the build on any known
# advisory, and lets the lockfile speak for itself on duplicate versions.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93

[[licenses.exceptions]]
# `ring` ships under a custom OpenSSL/ISC/MIT mix; allow only for the crate
# we pull in transitively if/when we encounter it.
allow = ["OpenSSL"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
